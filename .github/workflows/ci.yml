name: "CI"
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "npm"
      - name: Install NPM packages
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test:unit:ci
